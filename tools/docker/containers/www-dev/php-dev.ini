; Development settings - noisy errors, generous limits. Not for production.
memory_limit = 1024M
max_execution_time = 300
upload_max_filesize = 32M
post_max_size = 32M
; stderr, not On: keeps errors out of the HTTP response. Printed into the
; response, a notice sends the headers early, which turns redirects into
; meta-refresh pages and breaks Dusk logins.
display_errors = stderr
error_reporting = E_ALL
date.timezone = UTC
